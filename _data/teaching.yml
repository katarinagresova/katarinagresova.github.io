- name: "GenBenchQC: automated quality control of genomic sequence benchmarks reveals widespread biases in deep learning datasets"
  kind: talk
  when: "2026"
  where: "EMBO | EMBL Symposium: AI and biology, EMBL Heidelberg"
  blurb: >-
    A selected talk on auditing the datasets the field trains on, in a session
    with Oded Regev and Peter Koo. The short version: a benchmark nobody has
    checked is a benchmark a model can pass for the wrong reason.
