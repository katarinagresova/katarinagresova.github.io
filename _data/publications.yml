# Newest first. `selected: true` puts it on the landing page; everything here
# shows on /publications/ regardless.
#
# Author names are written plainly; the one matching `highlight_author` in
# _config.yml is automatically bolded, so spell it exactly the same way here.
#
# Optional `note:` prints a small label next to the venue — use it for
# "Preprint", "Review", "Conference" and the like.
#
# Two keys describe authorship position, because author order alone hides it:
#
#   first_author: true   -> counted in the "N as first or co-first" figures on
#                           the landing page and the publications header. Set it
#                           only where she led the paper.
#   author_note: "..."   -> the text of the marker chip. Defaults to "First
#                           author" when first_author is set; use it for
#                           "Co-first author", "Shared second author" and the
#                           like. On its own, without first_author, it prints a
#                           quieter chip and is not counted.

