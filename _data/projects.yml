  tags: [python, pytorch, datasets]
  url: "https://github.com/ML-Bioinfo-CEITEC/genomic_benchmarks"

- name: "Biology Crash Course"
  blurb: >-
    Informal notes from semi-formal biology discussions. Written for computer
    scientists who need enough molecular biology to be dangerous.
  tags: [teaching, notes]
  url: "https://katarinagresova.github.io/biology-crash-course/"
