# The CV page, section by section. Two kinds of section:
#
#   entries: -> timeline rows (when / what / where / detail)
#   items:   -> a plain bulleted list
#
# `when` shows in a narrow left rail — keep it to about fourteen characters or
# it wraps. `detail` is passed through as HTML, so <em> and <a> work.

- section: Research positions
  entries:
    - when: "2025 – present"
      what: "Postdoctoral researcher"
      where: "Berlin Institute for Medical Systems Biology (BIMSB), Max Delbrück Center, Berlin"
      detail: >-
        Interpretable machine learning for RNA regulation: what in an mRNA's own
        sequence sets how much protein a cell makes from it, and what that
        explains about health and disease.

    - when: "2023 – 2025"
      what: "Researcher"
      where: "Intelligent Systems for Complex Data group, Masaryk University, Brno"
      detail: >-
        Protein-structure similarity search at proteome scale — adapting
        pretrained networks to produce structure embeddings, and the pipelines
        to run them on HPC.

    - when: "2024 – 2025"
      what: "Pre-doctoral fellow"
      where: "Laboratory of Genetics and Genomics, National Institute on Aging, NIH, Baltimore"
      detail: >-
        Senescent-cell classification from single-cell long-read sequencing in
        the ageing mouse brain, and shared senescence markers across cell types
        from transcriptomic and proteomic data.

    - when: "2023 – 2024"
      what: "Visiting researcher"
      where: "Alexiou Lab, University of Malta, Msida"
      detail: >-
        Led the miRBench project. Taught deep learning and interpretability,
        and supervised four junior researchers.

    - when: "2020 – 2023"
      what: "Research specialist"
      where: "Alexiou group, CEITEC, Masaryk University, Brno"
      detail: >-
        Genomic Benchmarks, attribution-based interpretation of sequence models,
        and deep learning for RNA. Ran the group's workshops and hackathons.

