# The next three sections are not written out here — they are pulled from
# _data/work.yml and _data/teaching.yml so that a project or a course is
# described in exactly one place. `from` names the data file, `kinds` picks
# which entries, and `link` is the page to send the reader to for the detail.

- section: Software and data
  from: work
  kinds: [benchmark, model, service, pipeline]
  link: /building/
  link_text: what each of these actually is

- section: Teaching and supervision
  from: teaching
  kinds: [course, material, supervision, organised]
  link: /teaching/
  link_text: the full teaching record

- section: Talks and outreach
  from: teaching
  kinds: [talk]

