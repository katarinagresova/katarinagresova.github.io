# =============================================================================
#  Site settings  —  most things you'll want to change day to day live here,
#  or in the _data/*.yml files (publications, projects, links).
# =============================================================================

title: Katarína Grešová
tagline: Machine learning for biology, built to be reused
description: >-
  Katarína Grešová — computational biologist and former software engineer,
  looking for a research scientist or project lead role at a bio, health or
  techbio company. Machine learning for RNA regulation, the benchmarks that
  keep it honest, and teaching in both directions. Berlin, or remote across
  Europe.
url: https://katarinagresova.com
baseurl: ""
lang: en

author:
  name: Katarína Grešová
  email: contact@katarinagresova.com

# Shown in the hero. Keep the tagline short — it is set in large type.
hero:
  location: Berlin, Germany
  affiliation: Max Delbrück Center
  affiliation_url: https://www.mdc-berlin.de/
  photo: /assets/img/profile.jpg
  photo_alt: Portrait of Katarína Grešová

# Profile used by the "All on Scholar" link in the publications section.
scholar_url: "https://scholar.google.com/citations?user=cFwEwxoAAAAJ&hl=en"

# Which name to render in bold in author lists (see _data/publications.yml).
highlight_author: Katarína Grešová

# =============================================================================
#  Build
# =============================================================================

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  # Source material to work from lives in _source/, which Jekyll already skips
  # because the name starts with an underscore. It used to be matched here with
  # "*.pdf", which quietly excluded assets/katarina-gresova-cv.pdf too: Jekyll
  # globs with fnmatch and no FNM_PATHNAME, so a "*" happily crosses a slash.
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .github

defaults:
  - scope:
      path: ""
    values:
      layout: page
