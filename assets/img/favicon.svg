<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Matches the .nav__badge mark: rounded square, the accent gradient, white
       monospace "KG". A favicon can't read CSS custom properties, so the token
       values from main.css (light mode) are hard-coded here. -->
  <defs>
    <linearGradient id="kg" x1="-7%" y1="40%" x2="107%" y2="60%">
      <stop offset="0" stop-color="#5b4bff"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#kg)"/>
  <text x="50%" y="53%" dominant-baseline="central" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="32" font-weight="600" letter-spacing="1.5" fill="#ffffff">KG</text>
</svg>
